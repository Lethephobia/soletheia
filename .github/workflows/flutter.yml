name: Flutter CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  CARGO_TERM_COLOR: always

jobs:
  flutter:
    name: Flutter
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/soletheia_wallet
    steps:
      - uses: actions/checkout@v6
      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/flutter-sdk
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}
      - name: Set up Flutter from official repository
        run: bash "$GITHUB_WORKSPACE/.github/scripts/setup-flutter.sh"
      - name: Cache Dart dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('apps/soletheia_wallet/pubspec.lock') }}
      - name: Set up Rust toolchain
        working-directory: apps/soletheia_wallet/packages/infrastructure/rust
        run: rustup show active-toolchain
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/soletheia_wallet/packages/infrastructure/rust/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ hashFiles('apps/soletheia_wallet/packages/infrastructure/rust/rust-toolchain.toml', 'apps/soletheia_wallet/packages/infrastructure/rust/**/Cargo.toml', 'apps/soletheia_wallet/packages/infrastructure/rust/Cargo.lock') }}
      - name: Install Dart dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate localizations
        working-directory: apps/soletheia_wallet/app
        run: flutter gen-l10n
      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          app/lib app/test
          packages/application/lib packages/application/test
          packages/infrastructure/lib packages/infrastructure/test
      - name: Analyze
        run: flutter analyze --no-pub --fatal-infos
      - name: Test app
        working-directory: apps/soletheia_wallet/app
        run: flutter test --no-pub
      - name: Test application package
        working-directory: apps/soletheia_wallet/packages/application
        run: flutter test --no-pub
      - name: Build Rust bridge for tests
        working-directory: apps/soletheia_wallet/packages/infrastructure/rust
        run: cargo build --workspace --locked
      - name: Test Rust bridge
        env:
          FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR: ${{ github.workspace }}/apps/soletheia_wallet/packages/infrastructure/rust/target/debug
        run: dart test packages/infrastructure/test
      - name: Build macOS app
        working-directory: apps/soletheia_wallet/app
        run: flutter build macos --release --no-pub
      - name: Build unsigned iOS app
        working-directory: apps/soletheia_wallet/app
        run: flutter build ios --release --no-codesign --no-pub
