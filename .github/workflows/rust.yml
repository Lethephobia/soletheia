name: Rust CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/soletheia_wallet/packages/infrastructure/rust
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust toolchain
        run: |
          rustup show active-toolchain
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/soletheia_wallet/packages/infrastructure/rust/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('apps/soletheia_wallet/packages/infrastructure/rust/rust-toolchain.toml', 'apps/soletheia_wallet/packages/infrastructure/rust/Cargo.toml', 'apps/soletheia_wallet/packages/infrastructure/rust/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check dependency advisories, licenses and sources
        run: cargo deny --locked check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --all-features --locked
      - name: Build
        run: cargo build --all-targets --all-features --locked
