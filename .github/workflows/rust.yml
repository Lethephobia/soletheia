name: Rust CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/soletheia_app/packages/infrastructure/rust
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust toolchain
        run: |
          rustup show active-toolchain
      - name: Detect workspace members
        id: workspace
        run: |
          members="$(cargo metadata --no-deps --format-version 1 | jq '.workspace_members | length')"
          echo "has-members=$([ "$members" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$members" -eq 0 ]; then
            echo 'No Rust workspace members yet; skipping Rust checks.'
          fi
      - name: Cache Rust dependencies and build outputs
        if: steps.workspace.outputs.has-members == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/soletheia_app/packages/infrastructure/rust/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('apps/soletheia_app/packages/infrastructure/rust/rust-toolchain.toml', 'apps/soletheia_app/packages/infrastructure/rust/**/Cargo.toml', 'apps/soletheia_app/packages/infrastructure/rust/Cargo.lock') }}
      - name: Check formatting
        if: steps.workspace.outputs.has-members == 'true'
        run: cargo fmt --all --check
      - name: Install cargo-deny
        if: steps.workspace.outputs.has-members == 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check dependency advisories, licenses and sources
        if: steps.workspace.outputs.has-members == 'true'
        run: cargo deny --locked check
      - name: Clippy
        if: steps.workspace.outputs.has-members == 'true'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        if: steps.workspace.outputs.has-members == 'true'
        run: cargo test --workspace --all-features --locked
      - name: Build
        if: steps.workspace.outputs.has-members == 'true'
        run: cargo build --workspace --all-targets --all-features --locked
