[package]
name = "soletheia_flutter_bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
bip39 = { version = "3.0.0", features = ["all-languages", "zeroize"] }
getrandom = { version = "0.4", features = ["std"] }
solana-derivation-path = "3.0.0"
solana-keypair = { version = "4.0.0", features = ["seed-derivable"] }
thiserror = "2"
zeroize = "1"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
core-foundation = "0.10.1"
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
security-framework-sys = { version = "2.17.0", features = ["OSX_10_15"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
